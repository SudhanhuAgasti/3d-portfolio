<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <!-- Vibrant Emerald-to-Cyan Electric Gradient -->
    <linearGradient id="skaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- Soft Neon Ambient Glow Filter -->
    <filter id="skaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Geometric Hex Shield Icon Badge -->
  <g transform="translate(6, 6)">
    <!-- Outer Cyber Hexagon -->
    <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" 
             stroke="url(#skaGrad)" 
             stroke-width="2.2" 
             fill="rgba(8, 14, 26, 0.75)" 
             filter="url(#skaGlow)" />
    
    <!-- Inner Cyber Diamond / Core Node -->
    <polygon points="24,14 33,24 24,34 15,24" 
             fill="url(#skaGrad)" 
             opacity="0.85" />
    
    <!-- Core Spark Dot -->
    <circle cx="24" cy="24" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography: Stylized SKA Monogram -->
  <g transform="translate(64, 40)">
    <!-- Monogram Letters with Luxury Tracking -->
    <text font-family="'Syne', 'Space Grotesk', -apple-system, sans-serif" 
          font-size="27" 
          font-weight="800" 
          letter-spacing="4px" 
          fill="#ffffff">
      SKA<tspan fill="url(#skaGrad)" font-size="30">.</tspan>
    </text>
    
    <!-- Subtitle Tech Pill: FULL STACK // AI -->
    <text x="2" y="12" 
          font-family="'JetBrains Mono', monospace" 
          font-size="7.5" 
          font-weight="600" 
          letter-spacing="2.5px" 
          fill="#94a3b8">
      FULL STACK &bull; AI
    </text>
  </g>
</svg>
